name: Publish prepared release

# Resume a reviewed draft without rebuilding its native executables.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag with verified draft release assets
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-refs/tags/${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      packages: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - name: Validate tag and draft assets
        run: |
          bun -e 'import {validateVersion} from "./apps/calendarpit/scripts/release/artifacts.ts"; validateVersion(process.env.RELEASE_TAG);'
          test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = true
          gh release download "$RELEASE_TAG" --dir prepared --pattern '*.tar.gz' --pattern SHA256SUMS --pattern calendarpit.rb
          bun -e 'import {verifyReleaseArtifacts} from "./apps/calendarpit/scripts/release/artifacts.ts"; await verifyReleaseArtifacts("prepared");'
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          path: source
      - name: Check source version
        working-directory: source
        run: bun -e 'const {version}=await Bun.file("packages/server/package.json").json(); if(process.env.RELEASE_TAG !== `v${version}`) throw new Error("Tag version mismatch");'
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: version
        run: echo "value=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: source
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/iktakahiro/calendarpit:${{ steps.version.outputs.value }}
            ghcr.io/iktakahiro/calendarpit:latest
          labels: org.opencontainers.image.version=${{ steps.version.outputs.value }}
      - name: Publish GitHub release
        run: gh release edit "$RELEASE_TAG" --draft=false --latest
