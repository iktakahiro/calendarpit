name: Publish prepared release

# Native builds avoid running Bun's compiler under CPU emulation.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag with verified draft release assets
        required: true
        type: string
  workflow_call:
    inputs:
      tag:
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: prepared-release-${{ inputs.tag }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.tag }}
  IMAGE: ghcr.io/iktakahiro/calendarpit

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - name: Validate tag and draft assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bun -e 'import {validateVersion} from "./apps/calendarpit/scripts/release/artifacts.ts"; validateVersion(process.env.RELEASE_TAG);'
          test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = true
          gh release download "$RELEASE_TAG" --dir prepared --pattern '*.tar.gz' --pattern SHA256SUMS --pattern calendarpit.rb
          bun -e 'import {verifyReleaseArtifacts} from "./apps/calendarpit/scripts/release/artifacts.ts"; await verifyReleaseArtifacts("prepared");'

  images:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    environment: release
    permissions:
      contents: read
      packages: write
    env:
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - name: Check source version
        run: bun -e 'const {version}=await Bun.file("packages/server/package.json").json(); if(process.env.RELEASE_TAG !== `v${version}`) throw new Error("Tag version mismatch");'
      - name: Build and test native image
        run: |
          docker build --label "org.opencontainers.image.version=${RELEASE_TAG#v}" -t "$IMAGE:${RELEASE_TAG#v}-$ARCH" .
          bun run smoke:docker "$IMAGE:${RELEASE_TAG#v}-$ARCH"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push native image
        run: docker push "$IMAGE:${RELEASE_TAG#v}-$ARCH"

  publish:
    needs: images
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish multi-platform image
        run: |
          docker buildx imagetools create \
            --tag "$IMAGE:${RELEASE_TAG#v}" --tag "$IMAGE:latest" \
            "$IMAGE:${RELEASE_TAG#v}-amd64" "$IMAGE:${RELEASE_TAG#v}-arm64"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = true
          gh release edit "$RELEASE_TAG" --draft=false --latest
