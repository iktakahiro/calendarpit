name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the checked-out version tag after validation
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bun run validate
      - run: bun run build
      - run: bun run --cwd apps/calendarpit playwright install --with-deps chromium
      - run: bun run test:e2e
      - run: bun run docs:check

  binaries:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            platform: darwin-arm64
          - runner: macos-15-intel
            platform: darwin-x64
          - runner: ubuntu-24.04
            platform: linux-x64
          - runner: ubuntu-24.04-arm
            platform: linux-arm64
          - runner: windows-2025
            platform: win32-x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bun run --cwd apps/calendarpit build
      - run: bun apps/calendarpit/scripts/build-binary.ts --platform ${{ matrix.platform }}
      - run: bun run smoke
      - run: bun run release:package ${{ matrix.platform }}
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.platform }}
          path: |
            apps/calendarpit/dist/release/artifacts/calendarpit-*-${{ matrix.platform }}.tar.gz
          if-no-files-found: error

  containers:
    needs: validate
    strategy:
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: docker build -t calendarpit:test .
      - run: bun run smoke:docker calendarpit:test
      - run: docker compose config --quiet

  assemble:
    needs: [binaries, containers]
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - uses: actions/download-artifact@v4
        with:
          pattern: native-*
          merge-multiple: true
          path: apps/calendarpit/dist/release/artifacts
      - id: version
        run: bun -e 'import {releaseVersion,validateVersion} from "./apps/calendarpit/scripts/release/artifacts.ts"; validateVersion(process.env.RELEASE_TAG); await Bun.write(process.env.GITHUB_OUTPUT, `version=${releaseVersion}\n`);'
        env:
          RELEASE_TAG: ${{ (github.event_name == 'push' || inputs.publish) && github.ref_name || '' }}
      - run: bun run release:assemble
      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: apps/calendarpit/dist/release/artifacts
          if-no-files-found: error

  publish:
    if: github.event_name == 'push' || inputs.publish
    needs: assemble
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      packages: write
    env:
      RELEASE_TAG: v${{ needs.assemble.outputs.version }}
      VERSION: ${{ needs.assemble.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - uses: actions/download-artifact@v4
        with:
          name: release
          path: apps/calendarpit/dist/release/artifacts
      - name: Verify release checksums
        working-directory: apps/calendarpit/dist/release/artifacts
        run: sha256sum --check SHA256SUMS
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" --json isDraft > release-state.json; then
            test "$(jq -r .isDraft release-state.json)" = true
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "Calendarpit $RELEASE_TAG" --generate-notes
          fi
          gh release upload "$RELEASE_TAG" apps/calendarpit/dist/release/artifacts/* --clobber

  publish-distributions:
    needs: [assemble, publish]
    permissions:
      contents: write
      packages: write
    uses: ./.github/workflows/publish-prepared.yml
    with:
      tag: v${{ needs.assemble.outputs.version }}

  homebrew:
    needs: [assemble, publish-distributions]
    if: vars.HOMEBREW_TAP_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release
          path: release
      - uses: actions/checkout@v4
        with:
          repository: iktakahiro/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap
      - name: Update Homebrew formula
        env:
          VERSION: ${{ needs.assemble.outputs.version }}
        run: |
          cd release
          sha256sum --check SHA256SUMS
          cd ../tap
          mkdir -p Formula
          cp ../release/calendarpit.rb Formula/calendarpit.rb
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Formula/calendarpit.rb
          if ! git diff --cached --quiet; then
            git commit -m "chore: update calendarpit to $VERSION"
            git push
          fi
